name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install dependencies
        run: npm install

      - name: Build patches
        run: ./gradlew buildAndroid generatePatchesList

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .mpp artifact
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          # Find the built .mpp file and rename it with version
          MPP_FILE=$(find patches/build/libs -name "*.mpp" | head -1)
          VERSION="${{ steps.release.outputs.new_release_version }}"
          cp "$MPP_FILE" "patches-${VERSION}.mpp"

          # Upload using gh CLI
          gh release upload "${{ steps.release.outputs.new_release_git_tag }}" "patches-${VERSION}.mpp" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update patches-list.json with release version
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.release.outputs.new_release_version }}"
          # Update patches-list.json version
          sed -i "s/\"version\": \"unspecified\"/\"version\": \"${VERSION}\"/" patches-list.json
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-list.json
          git commit -m "chore: update patches-list.json version to ${VERSION}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'opatches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/*.mpp

      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        run: ./gradlew :patches:buildAndroid clean --no-daemon